{% extends 'base.html' %}{% block content %}<h1>Manage Subjects</h1><form method="post" action="{{url_for('add_subject')}}" class="card"><label>Code</label><input name="subject_code" required><label>Name</label><input name="subject_name" required><label>Type</label><select name="subject_type"><option>Theory</option><option>Lab</option></select><label>Lectures/Week</label><input type="number" name="lectures_per_week" min="1" required><button>Add Subject</button></form><table><tr><th>ID</th><th>Code</th><th>Name</th><th>Type</th><th>Periods</th><th>Action</th></tr>{% for s in subjects %}<tr><td>{{s.id}}</td><td>{{s.subject_code}}</td><td>{{s.subject_name}}</td><td>{{s.subject_type}}</td><td>{{s.lectures_per_week}}</td><td><a href="{{url_for('edit_subject',id=s.id)}}">Edit</a> | <a href="{{url_for('delete_subject',id=s.id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
