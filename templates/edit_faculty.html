{% extends 'base.html' %}

{% block title %}Edit Faculty{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1 class="page-title">Edit Faculty</h1>
            <p class="page-subtitle">Update faculty details for {{ faculty.faculty_name }}</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('faculty') }}" class="btn btn-outline">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <div class="card content-card">
        <form method="post" class="standard-form">
            <div class="form-group">
                <label for="faculty_code">Faculty Code</label>
                <input id="faculty_code" name="faculty_code" class="form-control" value="{{ faculty.faculty_code }}" required>
            </div>

            <div class="form-group">
                <label for="faculty_name">Faculty Name</label>
                <input id="faculty_name" name="faculty_name" class="form-control" value="{{ faculty.faculty_name }}" required>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary">
                    Update Faculty
                </button>
                <a href="{{ url_for('faculty') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
