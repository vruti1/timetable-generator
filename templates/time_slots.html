{% extends 'base.html' %}{% block content %}<h1>Manage Time Slots</h1><form method="post" action="{{url_for('add_time_slot')}}" class="card"><label>Day</label><select name="day">{% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}<option>{{d}}</option>{% endfor %}</select><label>Start</label><input type="time" name="start_time" required><label>End</label><input type="time" name="end_time" required><button>Add Time Slot</button></form><table><tr><th>ID</th><th>Day</th><th>Start</th><th>End</th><th>Action</th></tr>{% for t in time_slots %}<tr><td>{{t.id}}</td><td>{{t.day}}</td><td>{{t.start_time}}</td><td>{{t.end_time}}</td><td><a href="{{url_for('edit_time_slot',id=t.id)}}">Edit</a> | <a href="{{url_for('delete_time_slot',id=t.id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
