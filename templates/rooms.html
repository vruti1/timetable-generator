{% extends 'base.html' %}{% block content %}<h1>Manage Rooms/Labs</h1><form method="post" action="{{url_for('add_room')}}" class="card"><label>Name</label><input name="room_name" required><label>Type</label><select name="room_type"><option>Classroom</option><option>Lab</option></select><label>Capacity</label><input type="number" name="capacity" min="1" required><button>Add Room</button></form><table><tr><th>ID</th><th>Name</th><th>Type</th><th>Capacity</th><th>Action</th></tr>{% for r in rooms %}<tr><td>{{r.id}}</td><td>{{r.room_name}}</td><td>{{r.room_type}}</td><td>{{r.capacity}}</td><td><a href="{{url_for('edit_room',id=r.id)}}">Edit</a> | <a href="{{url_for('delete_room',id=r.id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
