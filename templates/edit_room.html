{% extends 'base.html' %}{% block content %}<h1>Edit Room</h1><form method="post" class="card"><label>Name</label><input name="room_name" value="{{room.room_name}}" required><label>Type</label><select name="room_type"><option {% if room.room_type=='Classroom' %}selected{% endif %}>Classroom</option><option {% if room.room_type=='Lab' %}selected{% endif %}>Lab</option></select><label>Capacity</label><input type="number" name="capacity" value="{{room.capacity}}" min="1" required><button>Update</button></form>{% endblock %}
