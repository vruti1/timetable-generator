{% extends 'base.html' %}{% block content %}<h1>Edit Subject</h1><form method="post" class="card"><label>Code</label><input name="subject_code" value="{{subject.subject_code}}" required><label>Name</label><input name="subject_name" value="{{subject.subject_name}}" required><label>Type</label><select name="subject_type"><option {% if subject.subject_type=='Theory' %}selected{% endif %}>Theory</option><option {% if subject.subject_type=='Lab' %}selected{% endif %}>Lab</option></select><label>Lectures/Week</label><input type="number" name="lectures_per_week" value="{{subject.lectures_per_week}}" min="1" required><button>Update</button></form>{% endblock %}
