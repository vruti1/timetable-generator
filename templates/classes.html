{% extends 'base.html' %}{% block content %}<h1>Manage Classes</h1><form method="post" action="{{url_for('add_class')}}" class="card"><label>Class Name</label><input name="class_name" required><label>Division</label><input name="division" required><label>Strength</label><input type="number" name="strength" min="1" required><button>Add Class</button></form><table><tr><th>ID</th><th>Class</th><th>Division</th><th>Strength</th><th>Action</th></tr>{% for c in classes %}<tr><td>{{c.id}}</td><td>{{c.class_name}}</td><td>{{c.division}}</td><td>{{c.strength}}</td><td><a href="{{url_for('edit_class',id=c.id)}}">Edit</a> | <a href="{{url_for('delete_class',id=c.id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
