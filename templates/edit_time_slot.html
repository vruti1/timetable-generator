{% extends 'base.html' %}

{% block title %}Edit Time Slot{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1 class="page-title">Edit Time Slot</h1>
            <p class="page-subtitle">Update slot timing for {{ time_slot.day }}</p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('time_slots') }}" class="btn btn-outline">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>
    </div>

    <div class="card content-card">
        <form method="post" class="standard-form">
            <div class="form-group">
                <label for="day">Day</label>
                <select id="day" name="day" class="form-control">
                    {% for d in ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'] %}
                    <option {% if time_slot.day == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="start_time">Start Time</label>
                    <input type="time" id="start_time" name="start_time" class="form-control" value="{{ time_slot.start_time.strftime('%H:%M') }}" required>
                </div>

                <div class="form-group col">
                    <label for="end_time">End Time</label>
                    <input type="time" id="end_time" name="end_time" class="form-control" value="{{ time_slot.end_time.strftime('%H:%M') }}" required>
                </div>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary">
                    Update Time Slot
                </button>
                <a href="{{ url_for('time_slots') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
