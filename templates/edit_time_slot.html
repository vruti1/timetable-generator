{% extends 'base.html' %}{% block content %}<h1>Edit Time Slot</h1><form method="post" class="card"><label>Day</label><select name="day">{% for d in ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] %}<option {% if time_slot.day==d %}selected{% endif %}>{{d}}</option>{% endfor %}</select><label>Start</label><input type="time" name="start_time" value="{{time_slot.start_time.strftime('%H:%M')}}" required><label>End</label><input type="time" name="end_time" value="{{time_slot.end_time.strftime('%H:%M')}}" required><button>Update</button></form>{% endblock %}
