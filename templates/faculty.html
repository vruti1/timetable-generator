{% extends 'base.html' %}{% block content %}<h1>Manage Faculty</h1><form method="post" action="{{url_for('add_faculty')}}" class="card"><label>Code</label><input name="faculty_code" required><label>Name</label><input name="faculty_name" required><button>Add Faculty</button></form><table><tr><th>ID</th><th>Code</th><th>Name</th><th>Action</th></tr>{% for f in faculty %}<tr><td>{{f.id}}</td><td>{{f.faculty_code}}</td><td>{{f.faculty_name}}</td><td><a href="{{url_for('edit_faculty',id=f.id)}}">Edit</a> | <a href="{{url_for('delete_faculty',id=f.id)}}" onclick="return confirm('Delete?')">Delete</a></td></tr>{% endfor %}</table>{% endblock %}
