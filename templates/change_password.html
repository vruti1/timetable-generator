{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-container" style="max-width: 500px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1 class="page-title">Change Password</h1>
            <p class="page-subtitle">Update password for user: <strong>{{ user.username }}</strong></p>
        </div>
        <div class="header-actions">
            <a href="{{ url_for('users') }}" class="btn btn-outline">
                <i class="fa-solid fa-arrow-left"></i> Back to Users
            </a>
        </div>
    </div>

    <div class="card content-card">
        <form method="POST" class="standard-form">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter new password" required autofocus>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="submit" class="btn btn-primary">
                    Update Password
                </button>
                <a href="{{ url_for('users') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
