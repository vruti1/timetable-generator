<!doctype html><html><head><meta charset="utf-8"><title>TT Generator</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><nav><b>TT Generator</b>{% if session.get('user_id') %}<a href="{{ url_for('timetable') }}">View Timetable</a><a href="{{ url_for('logout') }}">Logout</a><span>{{session.username}} ({{session.role}})</span>{% endif %}</nav><main>{% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in msgs %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
